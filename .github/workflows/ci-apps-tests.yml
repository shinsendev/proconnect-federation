name: 💚 CI Tests - Apps 🪪

on: push

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        app:
          - csmr-rie
          - mock-data-provider
          - mock-identity-provider
          - mock-service-provider
    uses: ./.github/workflows/reusable-node-lint.yml
    with:
      working-directory: ./${{ matrix.app }}
      node-version: "24"

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - hybridge
          - mock-data-provider
          - mock-identity-provider
          - mock-service-provider
          - statisticat
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./${{ matrix.app }}/package-lock.json
          node-version-file: ./admin/package.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
